[project]
name = "ragship"
version = "0.1.0"
description = "Docker Compose RAG service with an offline default path."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.0",
  "pypdf>=5.0",
  "python-multipart>=0.0.12",
  "pyyaml>=6.0",
  "qdrant-client>=1.13.3",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
sentence-transformers = ["sentence-transformers>=3.0"]
dev = ["httpx2>=2", "pytest>=8.0", "ruff>=0.7"]

[project.scripts]
ragship = "ragship.__main__:main"

[project.urls]
Homepage = "https://github.com/Howeverqhyn/ragship"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["ragship"]

[tool.ruff.format]
quote-style = "double"
